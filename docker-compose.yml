services:
  stromtarif-agent:
    build: .
    container_name: stromtarif-agent
    restart: unless-stopped
    ports:
      - "43145:43145"
    env_file:
      - .env
    environment:
      PORT: "43145"
      HOSTNAME: "0.0.0.0"
      DATA_DIR: /app/data
      TZ: Europe/Berlin
      # Discord kommt aus .env (env_file). Keine leeren ${VAR:-}-Defaults,
      # die gesetzte Werte überschreiben würden.
      REPORT_CRON: ${REPORT_CRON:-0 7 * * 1}
    volumes:
      - stromtarif-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43145/api/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 40s

volumes:
  stromtarif-data:
